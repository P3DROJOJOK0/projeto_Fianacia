<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplicação de controle financeiro com persistência em tempo real via Firebase Firestore." />
  <title>Controle Financeiro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />
  <link rel="stylesheet" href="./sytler.css" />
</head>
<body>

  <header class="app-header">
    <h1>💰 Controle Financeiro</h1>
    <p>Gestão de receitas e despesas em tempo real com Firebase</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>Nova Transação</h2>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="nome">Descrição</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex: Salário, Aluguel..."
            maxlength="80"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-group">
          <label for="valor">Valor (R$)</label>
          <input
            type="number"
            id="valor"
            name="valor"
            step="0.01"
            min="0.01"
            placeholder="0,00"
            inputmode="decimal"
            required
          />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo">
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
          </select>
        </div>

        <button type="submit">Salvar Transação</button>
      </form>
    </section>

    <section class="card">
      <h2>Resumo</h2>
      <div id="summary" class="summary" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>Transações</h2>

      <p id="loading-state" class="state-message">Carregando transações...</p>
      <p id="empty-state" class="state-message" hidden>Nenhuma transação cadastrada ainda.</p>

      <ul id="transaction-list" class="transaction-list" hidden aria-live="polite"></ul>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <!-- Módulo principal da aplicação (ESM: import/export) -->
  <script type="module" src="/main.js"></script>
</body>
</html>
